# GitHub Pages deployment for NESS Furniture public static frontend.
#
# This workflow deploys the contents of the `deploy-public-ghpages` directory
# (the GitHub Pages project-site variant) to GitHub Pages.
#
# IMPORTANT (security principle):
#   - The local CMS, SQLite database, and original uploads NEVER enter this repo.
#   - The repository contains ONLY the static public frontend (deploy-public-ghpages).
#   - Large videos (MP4/MOV > 25MB) are NOT committed; they are served from
#     GitHub Release assets (see /video-assets/README.md) and referenced by URL.
#
# Deployment method: GitHub Actions (official Pages actions), branch: main.

name: Deploy NESS static frontend to GitHub Pages

on:
  # Triggered when the static frontend is updated and pushed to main.
  push:
    branches: [main]
  # Allows manual redeploy from the Actions tab without code changes.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static frontend completeness
        run: |
          echo "Files in deploy-public-ghpages: $(find deploy-public-ghpages -type f | wc -l)"
          echo "Total size: $(du -sh deploy-public-ghpages | cut -f1)"
          # Critical integrity check: sample images must exist (they were missing from an earlier artifact upload)
          test -f "deploy-public-ghpages/media/derived/1786185490723-5b961f63-51a3-44b0-8ab1-1b16f61f594e-display.webp" && echo "Sample image OK"
          test -f "deploy-public-ghpages/index.html" && echo "index.html OK"
          test -f "deploy-public-ghpages/.nojekyll" && echo ".nojekyll OK"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages for this repository if it has not been
          # enabled yet (avoids requiring manual Settings -> Pages setup).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the static public frontend is published.
          path: deploy-public-ghpages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
